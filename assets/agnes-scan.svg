<svg width="100%" height="500" viewBox="0 0 1200 500"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="50%" stop-color="#10052b"/>
      <stop offset="100%" stop-color="#020b16"/>
    </linearGradient>

    <!-- Cyan glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scan glow -->
    <filter id="scanGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#00eaff"
            stroke-opacity=".08"/>
    </pattern>

    <!-- Clip -->
    <clipPath id="screen">
      <rect x="40" y="30" width="1120" height="440" rx="20"/>
    </clipPath>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200" height="500" fill="url(#bg)"/>

  <rect x="40" y="30"
        width="1120"
        height="440"
        rx="20"
        fill="url(#grid)"
        stroke="#00eaff"
        stroke-opacity=".35"/>


  <!-- TOP HUD -->

  <text x="70" y="70"
        fill="#00eaff"
        font-family="monospace"
        font-size="16"
        letter-spacing="4">
    PENYOY // TACHYON LAB
  </text>

  <text x="1130" y="70"
        text-anchor="end"
        fill="#7dffcf"
        font-family="monospace"
        font-size="14">
    SYSTEM ONLINE
  </text>


  <!-- CENTER TARGET -->

  <g transform="translate(600 245)"
     fill="none"
     stroke="#00eaff"
     filter="url(#glow)">

    <circle r="150"
            stroke-width="1"
            stroke-opacity=".25"/>

    <circle r="120"
            stroke-width="2"
            stroke-dasharray="8 15">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="12s"
        repeatCount="indefinite"/>
    </circle>

    <circle r="85"
            stroke-width="1"
            stroke-dasharray="3 8">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360"
        to="0"
        dur="7s"
        repeatCount="indefinite"/>
    </circle>

    <!-- crosshair -->

    <path d="M-175 0H175M0-175V175"
          stroke-opacity=".35"/>

  </g>


  <!-- AGNES IMAGE PLACEHOLDER -->

  <g transform="translate(600 245)">

    <circle r="65"
            fill="#13072c"
            stroke="#bd7cff"
            stroke-width="2"
            filter="url(#glow)"/>

    <text x="0"
          y="-8"
          text-anchor="middle"
          fill="#bd7cff"
          font-family="monospace"
          font-size="13">
      AGNES
    </text>

    <text x="0"
          y="15"
          text-anchor="middle"
          fill="#00eaff"
          font-family="monospace"
          font-size="10">
      TACHYON
    </text>

  </g>


  <!-- SCAN LINE GLOW -->

  <rect x="70"
        y="90"
        width="1060"
        height="12"
        fill="#00eaff"
        opacity=".15"
        filter="url(#scanGlow)">

    <animate
      attributeName="y"
      from="90"
      to="455"
      dur="3s"
      repeatCount="indefinite"/>
  </rect>


  <!-- SHARP SCAN LINE -->

  <rect x="70"
        y="90"
        width="1060"
        height="2"
        fill="#00eaff"
        filter="url(#glow)">

    <animate
      attributeName="y"
      from="90"
      to="455"
      dur="3s"
      repeatCount="indefinite"/>
  </rect>


  <!-- LEFT INFORMATION -->

  <g font-family="monospace">

    <text x="80" y="135"
          fill="#00eaff"
          font-size="12">
      SUBJECT_SCAN
    </text>

    <text x="80" y="160"
          fill="#ffffff"
          font-size="14">
      AGNES TACHYON
    </text>

    <text x="80" y="185"
          fill="#7dffcf"
          font-size="11">
      STATUS: DETECTED
    </text>

    <text x="80" y="215"
          fill="#778899"
          font-size="10">
      ANALYSIS
    </text>

    <rect x="80" y="225"
          width="180"
          height="5"
          rx="3"
          fill="#152638"/>

    <rect x="80" y="225"
          width="120"
          height="5"
          rx="3"
          fill="#00eaff">

      <animate
        attributeName="width"
        values="50;180;110;160;50"
        dur="4s"
        repeatCount="indefinite"/>
    </rect>

  </g>


  <!-- RIGHT INFORMATION -->

  <g font-family="monospace">

    <text x="940" y="135"
          fill="#00eaff"
          font-size="12">
      OPERATOR
    </text>

    <text x="940" y="160"
          fill="#ffffff"
          font-size="14">
      PENYOY
    </text>

    <text x="940" y="190"
          fill="#7dffcf"
          font-size="11">
      DEVELOPER
    </text>

    <text x="940" y="220"
          fill="#778899"
          font-size="10">
      EXPERIMENT_LEVEL
    </text>

    <text x="940" y="245"
          fill="#bd7cff"
          font-size="16">
      ∞
    </text>

  </g>


  <!-- BOTTOM TERMINAL -->

  <g font-family="monospace">

    <text x="80" y="420"
          fill="#778899"
          font-size="11">
      &gt; INITIALIZING EXPERIMENT...
    </text>

    <text x="80" y="442"
          fill="#00eaff"
          font-size="11">

      &gt; SCAN COMPLETE_

      <animate
        attributeName="opacity"
        values="1;.3;1"
        dur="1s"
        repeatCount="indefinite"/>

    </text>

  </g>


  <!-- CORNER MARKERS -->

  <g stroke="#00eaff"
     stroke-width="2"
     fill="none">

    <path d="M60 100V60H100"/>
    <path d="M1100 60H1140V100"/>
    <path d="M60 400V440H100"/>
    <path d="M1100 440H1140V400"/>

  </g>

</svg>
